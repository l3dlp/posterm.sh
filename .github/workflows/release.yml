# Push a tag vX.Y.Z → build, test, and publish the GitHub release that
# https://posterm.sh/install downloads (4 static binaries, the Mac zip, SHA256SUMS).
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Same script as a local release: gofmt, vet, tests, then dist/<tag>/.
      - run: bin/release.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/"$GITHUB_REF_NAME"/* \
            --title "POSTERM $GITHUB_REF_NAME" --generate-notes --verify-tag
