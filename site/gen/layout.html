<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}assets/site.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="POSTERM">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site}}og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A wall of colored post-its, each one a live terminal running a coding agent.">
<meta property="og:locale" content="{{og_locale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{desc}}">
<meta name="twitter:image" content="{{site}}og.png">
{{head}}<script src="{{root}}assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">{{t.skip}}</a>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="{{home}}" aria-label="POSTERM, {{t.home}}">POSTERM<span>.sh</span></a>
    <nav aria-label="Site">
      <a href="{{home}}#how">{{t.how}}</a>
      <a href="{{home}}#install">{{t.install}}</a>
      <a href="{{root}}design/">{{t.design}}</a>
      <a href="{{repo}}" rel="noopener">GitHub</a>
      <a class="lang" href="{{langHref}}" hreflang="{{t.langCode}}" lang="{{t.langCode}}" title="{{t.langName}}">{{t.lang}}</a>
    </nav>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="foot">
  <div class="wrap">
    <p class="logo">POSTERM<span>.sh</span></p>
    <p>MIT — © 2026 L3DLP · <a href="{{repo}}/blob/main/LICENSE" rel="noopener">{{t.license}}</a> · <a href="{{repo}}#readme" rel="noopener">{{t.readme}}</a> · <a href="{{root}}design/">{{t.design}}</a> · <a href="{{repo}}" rel="noopener">GitHub</a></p>
  </div>
</footer>
</body>
</html>
